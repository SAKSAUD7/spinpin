<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#0d0d1a;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0d1a;padding:40px 20px;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

      <!-- HEADER -->
      <tr><td style="background:linear-gradient(135deg,#e91e8c,#9c27b0);border-radius:16px 16px 0 0;padding:40px 32px;text-align:center;">
        <h1 style="margin:0;color:#ffffff;font-size:28px;font-weight:800;letter-spacing:-0.5px;">Spin Pin Leicester</h1>
      </td></tr>

      <!-- BODY -->
      <tr><td style="background:#ffffff;padding:36px 32px;font-size:15px;color:#1a1a2e;line-height:1.6;">
        {% block content %}{% endblock %}
      </td></tr>

      <!-- FOOTER -->
      <tr><td style="background:#1a1a2e;border-radius:0 0 16px 16px;padding:28px 32px;text-align:center;">
        <p style="margin:0 0 6px;font-size:15px;font-weight:700;color:#ffffff;">Spin Pin Leicester</p>
        <p style="margin:0 0 12px;font-size:13px;color:rgba(255,255,255,0.6);">Roller Skating · Ten Pin Bowling · Arcade</p>
        <p style="margin:0 0 15px;font-size:12px;color:rgba(255,255,255,0.4);">📧 info@spinpin.co.uk &nbsp;|&nbsp; 📍 Navigation Street, Leicester LE1 3UR</p>
        
        <div style="margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:rgba(255,255,255,0.3);">
            <p style="margin:0 0 5px;">You received this email because you visited Spin Pin.</p>
            <p style="margin:0;">Don't want these emails? <a href="{{ unsubscribe_url }}" style="color:rgba(255,255,255,0.5);text-decoration:underline;">Unsubscribe here</a></p>
        </div>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
